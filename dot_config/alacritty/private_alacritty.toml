[general]
import = [
    "~/.config/alacritty/themes/themes/catppuccin_frappe.toml"
]

live_config_reload = true

[env]
TERM = "xterm-256color"

[font]
size = 16.0

[font.bold]
family = "Iosevka Nerd Font"
style = "Heavy"

[font.bold_italic]
family = "Iosevka Nerd Font"
style = "Heavy Italic"

[font.italic]
family = "Iosevka Nerd Font"
style = "Medium Italic"

[font.normal]
family = "Iosevka Nerd Font"
style = "Medium"

[window]
#decorations = "buttonless"
dynamic_padding = false
opacity = 0.98
blur = true

[window.dimensions]
columns = 120
lines = 30
